<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEON BATTLESHIP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css?v=15" />
</head>
<body>
  <!-- Decorative CRT scanline overlay; pointer-events:none so it never blocks input. -->
  <div class="scanlines" aria-hidden="true"></div>

  <header class="site-header">
    <h1 class="logo">NEON BATTLESHIP</h1>
    <!-- Always-visible status line: tells the player what to do next. -->
    <p id="status-line" role="status" aria-live="polite">READY</p>
    <!-- Sound toggle; aria-pressed="true" means muted. Also bound to the M key. -->
    <button id="mute-btn" class="arcade-btn small" type="button" aria-pressed="false">
      SOUND: ON
    </button>
  </header>

  <main>
    <!-- ============ START SCREEN ============ -->
    <section id="start-screen" class="screen">
      <h2 class="start-title">NEON BATTLESHIP</h2>
      <button id="start-btn" class="arcade-btn">START</button>
      <div id="how-to-play" class="panel">
        <h3>HOW TO PLAY</h3>
        <ol>
          <li>Place your 5 ships on your grid.</li>
          <li>Take turns firing at the enemy grid.</li>
          <li>Sink all 5 enemy ships to win.</li>
          <li>Press R or tap ROTATE to turn a ship.</li>
        </ol>
      </div>
    </section>

    <!-- ============ GAME SCREEN ============ -->
    <section id="game-screen" class="screen" hidden>
      <div id="controls">
        <button id="rotate-btn" class="arcade-btn small">ROTATE</button>
        <button id="undo-btn" class="arcade-btn small">UNDO</button>
      </div>
      <div class="boards">
        <div class="board-wrap player-side">
          <h2 class="board-title">YOUR FLEET</h2>
          <!-- Board cells are generated by src/ui.js -->
          <div class="board" id="player-board" aria-label="Your grid"></div>
          <ul class="fleet-status" id="player-fleet" aria-label="Your ships"></ul>
        </div>
        <div class="board-wrap enemy-side">
          <h2 class="board-title">ENEMY WATERS</h2>
          <div class="board" id="enemy-board" aria-label="Enemy grid"></div>
          <ul class="fleet-status" id="enemy-fleet" aria-label="Enemy ships remaining"></ul>
        </div>
      </div>
    </section>
  </main>

  <!-- ============ END-OF-GAME OVERLAY ============ -->
  <div id="end-overlay" hidden>
    <div class="end-panel">
      <h2 id="end-title">VICTORY</h2>
      <table id="end-stats" aria-label="Game statistics"></table>
      <button id="play-again-btn" class="arcade-btn">PLAY AGAIN</button>
    </div>
  </div>

  <script type="module" src="src/ui.js?v=15"></script>
</body>
</html>
